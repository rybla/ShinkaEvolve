db_config:
  archive_criteria:
    combined_score: 1.0
    loc: -0.3
  archive_selection_strategy: crowding
  archive_size: 40
  elite_selection_ratio: 0.3
  enable_dynamic_islands: true
  enforce_island_separation: true
  island_elitism: true
  island_selection_strategy: equal
  island_spawn_strategy: best
  island_spawn_subtree_size: 2
  migration_interval: 10
  migration_rate: 0.1
  num_archive_inspirations: 4
  num_islands: 1
  num_top_k_inspirations: 2
  parent_selection_lambda: 10
  parent_selection_strategy: weighted
  stagnation_threshold: 10
evo_config:
  code_embed_sim_threshold: 0.99
  embedding_model: openrouter/google/gemini-embedding-001
  evolve_prompts: true
  init_program_path: generator_initial.py
  job_type: local
  language: python
  llm_dynamic_selection: ucb1
  llm_dynamic_selection_kwargs:
    cost_aware_coef: 0.7
    exploration_coef: 1.0
  llm_kwargs:
    max_tokens: 32768
    reasoning_efforts:
      - low
      - medium
      - high
    temperatures:
      - 0
      - 0.5
      - 1.0
  llm_models:
    - openrouter/google/gemini-3-flash-preview
  max_api_costs: 10.0
  max_novelty_attempts: 3
  max_patch_attempts: 3
  max_patch_resamples: 3
  meta_llm_kwargs:
    max_tokens: 16384
    temperatures:
      - 0
  meta_llm_models:
    - openrouter/google/gemini-3-flash-preview
  meta_rec_interval: 5
  novelty_llm_kwargs:
    temperatures:
      - 0
  novelty_llm_models:
    - openrouter/google/gemini-3-flash-preview
  num_generations: 2
  patch_type_probs:
    - 0.6
    - 0.3
    - 0.1
  patch_types:
    - diff
    - full
    - cross
  prompt_archive_size: 10
  prompt_epsilon: 0.25
  prompt_evolution_interval: 5
  prompt_patch_type_probs:
    - 0.5
    - 0.5
  prompt_patch_types:
    - diff
    - full
  prompt_percentile_recompute_interval: 1
  prompt_ucb_exploration_constant: 2.0
  results_dir: generator_results/results_v001_2026-03-17-15-51-52
max_db_workers: 2
max_evaluation_jobs: 2
max_proposal_jobs: 2
